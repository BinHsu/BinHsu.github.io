<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The meta-probe: what do you need humans for?</title>
  <desc>Decision diagram. Top: the question 'So what do you need humans for?'. Two answer branches. Left: a concrete human role — AI does X, humans own judgment, verification, accountability — verdict: proceed. Right: 'supervise the AI until it gets better' — verdict: you are a placeholder, run.</desc>

  <rect x="0" y="0" width="1000" height="620" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#25324B">The meta-probe</text>

  <!-- Question box -->
  <rect x="250" y="86" width="500" height="76" rx="10" fill="#25324B"/>
  <text x="500" y="132" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">&#8220;So what do you need humans for?&#8221;</text>

  <!-- Branch arrows -->
  <line x1="410" y1="162" x2="260" y2="242" stroke="#8C97A8" stroke-width="3"/>
  <polygon points="260,242 276,232 269,249" fill="#8C97A8"/>
  <line x1="590" y1="162" x2="740" y2="242" stroke="#8C97A8" stroke-width="3"/>
  <polygon points="740,242 724,232 731,249" fill="#8C97A8"/>

  <!-- Left answer: concrete human role -->
  <rect x="55" y="252" width="410" height="176" rx="10" fill="#FFFFFF" stroke="#1E6B5F" stroke-width="2.5"/>
  <text x="260" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#1E6B5F">A CONCRETE HUMAN ROLE</text>
  <text x="260" y="328" text-anchor="middle" font-size="18" font-style="italic" fill="#3A4256">&#8220;AI does X &#8212; humans own</text>
  <text x="260" y="354" text-anchor="middle" font-size="18" font-style="italic" fill="#3A4256">judgment, verification, accountability.&#8221;</text>
  <text x="260" y="398" text-anchor="middle" font-size="16" fill="#5B6472">the human side is load-bearing</text>

  <!-- Right answer: placeholder -->
  <rect x="535" y="252" width="410" height="176" rx="10" fill="#FFFFFF" stroke="#8C4126" stroke-width="2.5"/>
  <text x="740" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#8C4126">THE HEDGE</text>
  <text x="740" y="328" text-anchor="middle" font-size="18" font-style="italic" fill="#3A4256">&#8220;Someone has to supervise the AI</text>
  <text x="740" y="354" text-anchor="middle" font-size="18" font-style="italic" fill="#3A4256">until it gets better.&#8221;</text>
  <text x="740" y="398" text-anchor="middle" font-size="16" fill="#5B6472">you are a placeholder for the next model</text>

  <!-- Verdict arrows -->
  <line x1="260" y1="428" x2="260" y2="486" stroke="#8C97A8" stroke-width="3"/>
  <polygon points="260,486 251,470 269,470" fill="#8C97A8"/>
  <line x1="740" y1="428" x2="740" y2="486" stroke="#8C97A8" stroke-width="3"/>
  <polygon points="740,486 731,470 749,470" fill="#8C97A8"/>

  <!-- Verdicts -->
  <rect x="150" y="496" width="220" height="62" rx="31" fill="#2E9E8C"/>
  <text x="260" y="536" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">PROCEED</text>

  <rect x="630" y="496" width="220" height="62" rx="31" fill="#C1633A"/>
  <text x="740" y="536" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">RUN</text>
</svg>
