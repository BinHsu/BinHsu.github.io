<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="56" font-size="33" font-weight="700" fill="#1a202c">Cognitive load is conserved &#8212; it moves, it doesn't vanish</text>
  <text x="60" y="88" font-size="19" fill="#4a5568">The developer's half shrinks the same way in all three. What changes is who carries the operator's half.</text>

  <!-- Column hint labels -->
  <text x="265" y="135" font-size="15" font-weight="700" fill="#718096">DEVELOPER CARRIES</text>
  <text x="470" y="135" font-size="15" font-weight="700" fill="#718096">OPERATOR BURDEN &#8212; AND WHO HOLDS IT</text>

  <!-- ROW 1: ECS + Fargate -->
  <text x="60" y="190" font-size="21" font-weight="700" fill="#2d3748">ECS + Fargate</text>
  <rect x="255" y="150" width="150" height="64" rx="6" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="330" y="188" font-size="15" font-weight="700" fill="#22543d" text-anchor="middle">Dev</text>
  <rect x="410" y="150" width="745" height="64" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="430" y="188" font-size="19" font-weight="700" fill="#9c4221">AWS carries this &#8212; no cluster, no nodes</text>

  <!-- ROW 2: Cloud Run -->
  <text x="60" y="330" font-size="21" font-weight="700" fill="#2d3748">Cloud Run</text>
  <rect x="255" y="290" width="150" height="64" rx="6" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="330" y="328" font-size="15" font-weight="700" fill="#22543d" text-anchor="middle">Dev</text>
  <rect x="410" y="290" width="745" height="64" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="430" y="322" font-size="19" font-weight="700" fill="#2c5282">Google carries this</text>
  <text x="430" y="344" font-size="15" fill="#2a4365">Cloud Run = Knative Serving + Google's ops layer</text>

  <!-- ROW 3: Self-hosted Knative -->
  <text x="60" y="464" font-size="21" font-weight="700" fill="#2d3748">Self-hosted</text>
  <text x="60" y="488" font-size="21" font-weight="700" fill="#2d3748">Knative on EKS</text>
  <rect x="255" y="430" width="150" height="64" rx="6" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="330" y="468" font-size="15" font-weight="700" fill="#22543d" text-anchor="middle">Dev</text>
  <rect x="410" y="430" width="745" height="64" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="3"/>
  <text x="430" y="462" font-size="19" font-weight="700" fill="#22543d">YOUR platform team carries this</text>
  <text x="430" y="484" font-size="15" fill="#276749">cluster + Knative + networking layer + Activator + upgrades</text>

  <!-- Bottom note -->
  <text x="60" y="560" font-size="17" fill="#4a5568">The green block is the same small size in all three &#8212; that's the gift. The big block is the same size too;</text>
  <text x="60" y="584" font-size="17" fill="#4a5568">only the <tspan font-weight="700" fill="#2d3748">owner</tspan> changes. "I push a container and forget about it" is never free &#8212; someone is remembering it for you.</text>
</svg>
