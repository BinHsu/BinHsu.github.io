<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/></marker>
    <g id="x"><circle r="13" fill="#3a1d24"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#f7768e" stroke-width="3" stroke-linecap="round"/></g>
    <g id="v"><circle r="13" fill="#1f3320"/><path d="M-6,0 L-2,5 L6,-5" stroke="#9ece6a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="1200" height="630" fill="#0f1115"/>
  <text x="60" y="78" fill="#d7dbe2" font-size="40" font-weight="700">Which Google sign-ins survive a phishing relay?</text>
  <text x="60" y="118" fill="#7c8494" font-size="22">The fake page shows Google's real sign-in, relayed live. Anything you can hand over gets passed on.</text>

  <!-- flow -->
  <g font-size="20" text-anchor="middle">
    <rect x="60" y="180" width="150" height="80" rx="10" fill="#161922" stroke="#222633" stroke-width="2"/>
    <text x="135" y="226" fill="#d7dbe2" font-weight="700">You</text>
    <rect x="300" y="180" width="200" height="80" rx="10" fill="#2a1a20" stroke="#f7768e" stroke-width="2"/>
    <text x="400" y="215" fill="#f7768e" font-weight="700">Fake page</text>
    <text x="400" y="242" fill="#c0a0a8" font-size="16">look-alike domain</text>
    <rect x="590" y="180" width="150" height="80" rx="10" fill="#161922" stroke="#7aa2f7" stroke-width="2"/>
    <text x="665" y="226" fill="#7aa2f7" font-weight="700">Real Google</text>
  </g>
  <!-- code passes -->
  <path d="M135,275 L135,320 L380,320 L380,272" fill="none" stroke="#f7768e" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M420,264 L420,320 L665,320 L665,278" fill="none" stroke="#f7768e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="400" y="352" fill="#f7768e" font-size="19" text-anchor="middle">Password, code, phone tap: handed to the fake page, relayed to Google</text>
  <!-- passkey stops -->
  <path d="M135,390 L135,430 L385,430" fill="none" stroke="#9ece6a" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="392" y="412" width="8" height="36" fill="#9ece6a"/>
  <text x="400" y="480" fill="#9ece6a" font-size="19" text-anchor="middle">Passkey: the browser refuses the wrong domain</text>

  <!-- method list -->
  <rect x="790" y="165" width="350" height="370" rx="12" fill="#161922" stroke="#222633" stroke-width="2"/>
  <g font-size="21" fill="#d7dbe2">
    <use href="#x" x="825" y="205"/><text x="852" y="212">Password</text>
    <use href="#x" x="825" y="245"/><text x="852" y="252">SMS or voice code</text>
    <use href="#x" x="825" y="285"/><text x="852" y="292">Authenticator code</text>
    <use href="#x" x="825" y="325"/><text x="852" y="332">Backup code</text>
    <use href="#x" x="825" y="365"/><text x="852" y="372">Phone prompt</text>
    <use href="#x" x="825" y="405"/><text x="852" y="412">…with number matching</text>
    <use href="#v" x="825" y="455"/><text x="852" y="462" font-weight="700" fill="#9ece6a">Passkey</text>
    <use href="#v" x="825" y="495"/><text x="852" y="502" font-weight="700" fill="#9ece6a">Hardware security key</text>
  </g>
  <line x1="810" y1="430" x2="1120" y2="430" stroke="#222633" stroke-width="2"/>

  <text x="60" y="570" fill="#e0af68" font-size="24" font-weight="700">Type the URL yourself. Pause when a click asks you to sign in.</text>
  <text x="60" y="603" fill="#d7dbe2" font-size="22">Keep both habits. Just don't make them the only layer: everyone has foggy days.</text>
  <text x="1140" y="603" fill="#565f89" font-size="18" text-anchor="end">binhsu.github.io</text>
</svg>
