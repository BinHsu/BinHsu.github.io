<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0d1117"/>

  <text x="600" y="68" text-anchor="middle" fill="#e6edf3" font-size="48" font-weight="700">DHCP is why the shim can't work</text>
  <text x="600" y="108" text-anchor="middle" fill="#8b949e" font-size="22">apple/container assigns IPs by DHCP. The static-IP-at-create contract breaks on that.</text>

  <!-- ===== Lane A: Docker-API shim (fails) ===== -->
  <text x="60" y="168" fill="#f85149" font-size="19" font-weight="700" letter-spacing="1">DOCKER-API SHIM &#8212; config injected at create</text>

  <!-- 4 step boxes, w=250 gap=22 -> x=60,332,604,876 ; y=186 h=92 -->
  <g font-size="16">
    <rect x="60"  y="186" width="250" height="92" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="218" fill="#e6edf3" font-size="18" font-weight="700">Maker computes IP</text>
    <text x="80" y="244" fill="#8b949e">picks .2, bakes it into</text>
    <text x="80" y="264" fill="#8b949e">endpoint + cert SANs</text>

    <rect x="332" y="186" width="250" height="92" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="352" y="218" fill="#e6edf3" font-size="18" font-weight="700">Create with IP .2</text>
    <text x="352" y="244" fill="#8b949e">config passed as</text>
    <text x="352" y="264" fill="#8b949e">USERDATA at boot</text>

    <rect x="604" y="186" width="250" height="92" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="624" y="218" fill="#e6edf3" font-size="18" font-weight="700">DHCP hands .8</text>
    <text x="624" y="244" fill="#8b949e">node really binds .8,</text>
    <text x="624" y="264" fill="#8b949e">but config says .2</text>

    <rect x="876" y="186" width="264" height="92" rx="11" fill="#2d1416" stroke="#f85149" stroke-width="2"/>
    <text x="896" y="218" fill="#f85149" font-size="18" font-weight="700">&#10007; never forms</text>
    <text x="896" y="244" fill="#8b949e">certs/endpoint mismatch</text>
    <text x="896" y="264" fill="#8b949e">&#8212; the socktainer wall</text>
  </g>
  <g fill="#6e7681" font-size="24" text-anchor="middle">
    <text x="321" y="240">&#8594;</text>
    <text x="593" y="240">&#8594;</text>
    <text x="865" y="240">&#8594;</text>
  </g>

  <line x1="60" y1="316" x2="1140" y2="316" stroke="#21262d" stroke-width="1.5"/>

  <!-- ===== Lane B: Native provider (works) ===== -->
  <text x="60" y="368" fill="#3fb950" font-size="19" font-weight="700" letter-spacing="1">NATIVE PROVIDER &#8212; owns Create, reconciles after boot</text>

  <g font-size="16">
    <rect x="60"  y="386" width="244" height="100" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="418" fill="#e6edf3" font-size="18" font-weight="700">Launch bare</text>
    <text x="80" y="444" fill="#8b949e">node boots into</text>
    <text x="80" y="464" fill="#8b949e">maintenance, no config</text>

    <rect x="326" y="386" width="244" height="100" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="346" y="418" fill="#e6edf3" font-size="18" font-weight="700">Discover IP</text>
    <text x="346" y="444" fill="#8b949e">container inspect</text>
    <text x="346" y="464" fill="#8b949e">reads the DHCP .8</text>

    <rect x="592" y="386" width="244" height="100" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="612" y="418" fill="#e6edf3" font-size="18" font-weight="700">Patch endpoint</text>
    <text x="612" y="444" fill="#8b949e">configpatcher sets</text>
    <text x="612" y="464" fill="#8b949e">controlPlane to .8</text>

    <rect x="858" y="386" width="282" height="100" rx="11" fill="#0f2417" stroke="#238636" stroke-width="2"/>
    <text x="878" y="418" fill="#3fb950" font-size="18" font-weight="700">&#10003; cluster forms</text>
    <text x="878" y="444" fill="#8b949e">apply-config over the</text>
    <text x="878" y="464" fill="#8b949e">maintenance API</text>
  </g>
  <g fill="#6e7681" font-size="24" text-anchor="middle">
    <text x="315" y="442">&#8594;</text>
    <text x="581" y="442">&#8594;</text>
    <text x="847" y="442">&#8594;</text>
  </g>

  <text x="600" y="556" text-anchor="middle" fill="#8b949e" font-size="20">The framework never changes. The DHCP workaround lives entirely inside the provider.</text>
  <text x="600" y="600" text-anchor="middle" fill="#484f58" font-size="18">Owning Create is the seam the shim never had.  &#183;  binhsu.github.io</text>
</svg>
