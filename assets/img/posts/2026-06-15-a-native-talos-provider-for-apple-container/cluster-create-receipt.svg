<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0d1117"/>

  <text x="600" y="58" text-anchor="middle" fill="#e6edf3" font-size="40" font-weight="700">The canonical command, unchanged</text>
  <text x="600" y="94" text-anchor="middle" fill="#8b949e" font-size="21">No custom driver &#8212; the same talosctl flow every Talos user already knows.</text>

  <!-- terminal window -->
  <rect x="90" y="124" width="1020" height="446" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <rect x="90" y="124" width="1020" height="40" rx="12" fill="#161b22"/>
  <rect x="90" y="150" width="1020" height="14" fill="#161b22"/>
  <circle cx="116" cy="144" r="7" fill="#f85149"/>
  <circle cx="140" cy="144" r="7" fill="#d29922"/>
  <circle cx="164" cy="144" r="7" fill="#3fb950"/>
  <text x="600" y="149" text-anchor="middle" fill="#6e7681" font-size="15">talosctl &#8212; apple/container</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18.5">
    <text x="118" y="200"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">talosctl cluster create apple-container --name demo</tspan></text>
    <text x="118" y="230" fill="#8b949e">validating CIDR and reserving IPs</text>
    <text x="118" y="256" fill="#8b949e">creating network demo</text>
    <text x="118" y="282" fill="#8b949e">creating controlplane node demo-controlplane-1</text>
    <text x="118" y="308" fill="#8b949e">creating worker node demo-worker-1</text>
    <text x="118" y="334" fill="#8b949e">waiting for etcd, apid, kubelet, kube-proxy, coredns &#8230;</text>
    <text x="118" y="360"><tspan fill="#3fb950">&#10003;</tspan> <tspan fill="#e6edf3">all 2 nodes Ready &#183; health checks green</tspan></text>

    <text x="118" y="408"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">kubectl get nodes</tspan></text>
    <text x="118" y="434" fill="#8b949e">demo-controlplane-1   Ready   control-plane   62s   v1.36.1</text>
    <text x="118" y="460" fill="#8b949e">demo-worker-1         Ready   &#60;none&#62;          48s   v1.36.1</text>

    <text x="118" y="508"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">kubectl exec -it curl -- curl -s -o /dev/null -w '%{http_code}' \</tspan></text>
    <text x="118" y="532" fill="#e6edf3">      http://nginx.default.svc.cluster.local</text>
    <text x="118" y="558"><tspan fill="#3fb950" font-weight="700">200</tspan></text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#484f58" font-size="18">2 nodes Ready, CoreDNS + Service routing live, nginx answers 200.  &#183;  binhsu.github.io</text>
</svg>
