<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0d1117"/>

  <text x="600" y="74" text-anchor="middle" fill="#e6edf3" font-size="50" font-weight="700">Three ways to run Talos locally</text>
  <text x="600" y="116" text-anchor="middle" fill="#8b949e" font-size="23">Apple's container runtime sat between them &#8212; with no provider. So we built one.</text>

  <!-- card geometry: w=344 gap=24, x = 60, 428, 796 ; y=164 h=392 -->

  <!-- Column 1: OrbStack / docker provisioner -->
  <rect x="60" y="164" width="344" height="392" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="232" y="208" text-anchor="middle" fill="#e6edf3" font-size="27" font-weight="700">OrbStack</text>
  <text x="232" y="236" text-anchor="middle" fill="#6e7681" font-size="17">docker provisioner</text>
  <line x1="92" y1="258" x2="372" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="92" y="300" fill="#8b949e" font-size="18" font-weight="600">Kernel</text>
  <text x="92" y="326" fill="#e6edf3" font-size="19">Shared &#8212; one for all nodes</text>
  <text x="92" y="372" fill="#8b949e" font-size="18" font-weight="600">Node IP</text>
  <text x="92" y="398" fill="#e6edf3" font-size="19">Static &#8212; pinned at create</text>
  <text x="92" y="476" fill="#6e7681" font-size="18">Works. Survives restart.</text>
  <text x="92" y="502" fill="#6e7681" font-size="18">Lower isolation.</text>

  <!-- Column 2: apple/container (highlighted) -->
  <rect x="428" y="164" width="344" height="392" rx="14" fill="#0f2417" stroke="#238636" stroke-width="2.5"/>
  <text x="600" y="208" text-anchor="middle" fill="#3fb950" font-size="27" font-weight="700">apple/container</text>
  <text x="600" y="236" text-anchor="middle" fill="#6e7681" font-size="17">the new native provider</text>
  <line x1="460" y1="258" x2="740" y2="258" stroke="#238636" stroke-width="1" opacity="0.5"/>
  <text x="460" y="300" fill="#8b949e" font-size="18" font-weight="600">Kernel</text>
  <text x="460" y="326" fill="#e6edf3" font-size="19">Micro-VM per node (6.18.15)</text>
  <text x="460" y="372" fill="#8b949e" font-size="18" font-weight="600">Node IP</text>
  <text x="460" y="398" fill="#3fb950" font-size="19" font-weight="700">DHCP &#8212; assigned at boot</text>
  <text x="460" y="476" fill="#e6edf3" font-size="18">No Docker API.</text>
  <text x="460" y="502" fill="#e6edf3" font-size="18">Per-node kernel isolation.</text>

  <!-- Column 3: QEMU -->
  <rect x="796" y="164" width="344" height="392" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="968" y="208" text-anchor="middle" fill="#e6edf3" font-size="27" font-weight="700">QEMU</text>
  <text x="968" y="236" text-anchor="middle" fill="#6e7681" font-size="17">qemu provisioner</text>
  <line x1="828" y1="258" x2="1108" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="828" y="300" fill="#8b949e" font-size="18" font-weight="600">Kernel</text>
  <text x="828" y="326" fill="#e6edf3" font-size="19">Full VM per node</text>
  <text x="828" y="372" fill="#8b949e" font-size="18" font-weight="600">Node IP</text>
  <text x="828" y="398" fill="#e6edf3" font-size="19">Static &#8212; pinned at create</text>
  <text x="828" y="476" fill="#6e7681" font-size="18">Works. Highest fidelity.</text>
  <text x="828" y="502" fill="#6e7681" font-size="18">Heavyweight, slow boot.</text>

  <text x="600" y="600" text-anchor="middle" fill="#484f58" font-size="18">The static-IP contract is what made the middle column need its own provider.  &#183;  binhsu.github.io</text>
</svg>
