<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-label="Kubernetes control plane and worker nodes"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Heiti TC","Noto Sans TC",Arial,sans-serif}
.disp{font-weight:700}
.mono{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
.t{fill:#1A2040}.t2{fill:#434C70}.tm{fill:#69719A}
.f1{fill:#3E63DD}.f2{fill:#B07606}.f3{fill:#12927F}.fw{fill:#B4442E}
.s1f{fill:#E3E9FC}.s2f{fill:#F6ECD6}.s3f{fill:#D9F1EC}.swf{fill:#F8E2DC}
.pp{fill:#FFFFFF}.pp2{fill:#EEF1F8}
.ln{stroke:#D3D9EA;fill:none}.lk{stroke:#434C70;fill:none}
.l1{stroke:#3E63DD;fill:none}.l2{stroke:#B07606;fill:none}.l3{stroke:#12927F;fill:none}.lw{stroke:#B4442E;fill:none}
.egg{fill:#7A5BB0;font-style:italic}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#434C70"/></marker>
<marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E63DD"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B07606"/></marker>
<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12927F"/></marker>
</defs><rect x="1" y="1" width="778" height="348" rx="16" fill="#F7F8FC" stroke="#D3D9EA"/>
<rect x="20" y="20" width="740" height="128" rx="14" class="s1f"/>
<text x="38" y="46" class="f1 disp" font-size="15">Control plane: management, thinks but never lifts</text>
<g font-size="12.5">
<rect x="38" y="60" width="160" height="72" rx="10" class="pp"/><text x="118" y="84" text-anchor="middle" class="t disp" font-size="14">API server</text>
<text x="118" y="104" text-anchor="middle" class="t2">front desk: authn, authz</text><text x="118" y="121" text-anchor="middle" class="tm" font-size="11">everyone talks to it</text>
<rect x="218" y="60" width="160" height="72" rx="10" class="pp"/><text x="298" y="84" text-anchor="middle" class="t disp" font-size="14">etcd</text>
<text x="298" y="104" text-anchor="middle" class="t2">the record book</text><text x="298" y="121" text-anchor="middle" class="tm" font-size="11">cluster state, not app data</text>
<rect x="398" y="60" width="160" height="72" rx="10" class="pp"/><text x="478" y="84" text-anchor="middle" class="t disp" font-size="14">controllers</text>
<text x="478" y="104" text-anchor="middle" class="t2">want 3? keep 3</text><text x="478" y="121" text-anchor="middle" class="tm" font-size="11">the control loop</text>
<rect x="578" y="60" width="164" height="72" rx="10" class="pp"/><text x="660" y="84" text-anchor="middle" class="t disp" font-size="14">scheduler</text>
<text x="660" y="104" text-anchor="middle" class="t2">who has room?</text><text x="660" y="121" text-anchor="middle" class="tm" font-size="11">decides, never starts pods</text>
</g>
<rect x="20" y="178" width="360" height="152" rx="14" class="s2f"/><text x="38" y="204" class="f2 disp" font-size="15">Worker node 1</text>
<rect x="400" y="178" width="360" height="152" rx="14" class="s2f"/><text x="418" y="204" class="f2 disp" font-size="15">Worker node 2</text>
<g font-size="12">
<rect x="38" y="216" width="100" height="44" rx="8" class="pp"/><text x="88" y="235" text-anchor="middle" class="t disp" font-size="13">kubelet</text><text x="88" y="251" text-anchor="middle" class="tm" font-size="10.5">badge + foreman</text>
<rect x="148" y="216" width="104" height="44" rx="8" class="pp"/><text x="200" y="235" text-anchor="middle" class="t disp" font-size="13">containerd</text><text x="200" y="251" text-anchor="middle" class="tm" font-size="10.5">runs containers</text>
<rect x="262" y="216" width="100" height="44" rx="8" class="pp"/><text x="312" y="235" text-anchor="middle" class="t disp" font-size="13">kube-proxy</text><text x="312" y="251" text-anchor="middle" class="tm" font-size="10.5">Service rules</text>
<rect x="418" y="216" width="100" height="44" rx="8" class="pp"/><text x="468" y="243" text-anchor="middle" class="t disp" font-size="13">kubelet</text>
<rect x="528" y="216" width="104" height="44" rx="8" class="pp"/><text x="580" y="243" text-anchor="middle" class="t disp" font-size="13">containerd</text>
<rect x="642" y="216" width="100" height="44" rx="8" class="pp"/><text x="692" y="243" text-anchor="middle" class="t disp" font-size="13">kube-proxy</text>
</g>
<rect x="38" y="272" width="70" height="40" rx="20.0" class="f2"/><text x="73.0" y="296.0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Pod</text><rect x="116" y="272" width="70" height="40" rx="20.0" class="f2"/><text x="151.0" y="296.0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Pod</text><rect x="418" y="272" width="70" height="40" rx="20.0" class="f2"/><text x="453.0" y="296.0" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Pod</text>
<text x="200" y="297" class="tm" font-size="12">pod: a small flat for a container</text>
<rect x="548" y="276" width="190" height="34" rx="6" fill="#FFF6C9"/><text x="643" y="298" text-anchor="middle" class="egg" font-size="12">sticky note: it's always DNS</text>
<path d="M118 132 V170 H88 V214" class="l1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah1)"/>
<path d="M118 170 H468 V214" class="l1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah1)"/>
</svg>
