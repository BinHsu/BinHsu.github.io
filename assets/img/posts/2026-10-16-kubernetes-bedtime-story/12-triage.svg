<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 420" width="784" height="420" role="img" aria-label="Troubleshooting tree by pod status"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Heiti TC","Noto Sans TC",Arial,sans-serif}
.disp{font-weight:700}
.mono{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
.t{fill:#1A2040}.t2{fill:#434C70}.tm{fill:#69719A}
.f1{fill:#3E63DD}.f2{fill:#B07606}.f3{fill:#12927F}.fw{fill:#B4442E}
.s1f{fill:#E3E9FC}.s2f{fill:#F6ECD6}.s3f{fill:#D9F1EC}.swf{fill:#F8E2DC}
.pp{fill:#FFFFFF}.pp2{fill:#EEF1F8}
.ln{stroke:#D3D9EA;fill:none}.lk{stroke:#434C70;fill:none}
.l1{stroke:#3E63DD;fill:none}.l2{stroke:#B07606;fill:none}.l3{stroke:#12927F;fill:none}.lw{stroke:#B4442E;fill:none}
.egg{fill:#7A5BB0;font-style:italic}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#434C70"/></marker>
<marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E63DD"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B07606"/></marker>
<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12927F"/></marker>
</defs><rect x="1" y="1" width="782" height="418" rx="16" fill="#F7F8FC" stroke="#D3D9EA"/>
<rect x="290" y="20" width="200" height="44" rx="22" class="f1"/><text x="390" y="47" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">kubectl get pods: STATUS?</text>
<g class="lk" stroke-width="1.6"><path d="M390 64 V84 H95 V104"/><path d="M390 84 H280 V104"/><path d="M390 84 V104"/><path d="M390 84 H505 V104"/><path d="M390 84 H685 V104"/></g>
<g font-size="12">
<rect x="24" y="106" width="142" height="40" rx="10" class="s2f"/><text x="95" y="131" text-anchor="middle" class="t mono" font-size="11.5">Pending</text>
<rect x="206" y="106" width="148" height="40" rx="10" class="swf"/><text x="280" y="131" text-anchor="middle" class="fw mono" font-size="11.5">ImagePullBackOff</text>
<rect x="362" y="106" width="56" height="40" rx="10" class="pp2"/><text x="390" y="131" text-anchor="middle" class="t2 mono" font-size="10">Config</text>
<rect x="430" y="106" width="150" height="40" rx="10" class="swf"/><text x="505" y="131" text-anchor="middle" class="fw mono" font-size="11.5">CrashLoopBackOff</text>
<rect x="610" y="106" width="150" height="40" rx="10" class="s3f"/><text x="685" y="126" text-anchor="middle" class="t mono" font-size="11.5">Running</text><text x="685" y="140" text-anchor="middle" class="tm" font-size="10">but the app errors</text>
</g>
<g font-size="11.5" class="t2">
<text x="24" y="174" class="tm">describe: Events</text>
<text x="24" y="196">- node out of CPU/memory</text><text x="24" y="216">- taint, no toleration</text>
<text x="24" y="236">- required affinity, no room</text><text x="24" y="256">- PVC will not attach</text>
<text x="24" y="276">- cluster full: Karpenter</text>
<text x="206" y="174" class="tm">describe: Events</text>
<text x="206" y="196">- no basic auth credentials:</text><text x="206" y="216">  node IAM role lacks ECR</text>
<text x="206" y="236">- private subnet, no NAT,</text><text x="206" y="256">  no ECR/S3 endpoints</text>
<text x="206" y="276">- the tag does not exist</text>
<text x="362" y="174" class="tm" font-size="10">Create</text><text x="362" y="187" class="tm" font-size="10">Container</text><text x="362" y="200" class="tm" font-size="10">ConfigError</text>
<text x="362" y="220" font-size="10.5">Secret or</text><text x="362" y="236" font-size="10.5">ConfigMap</text><text x="362" y="252" font-size="10.5">missing</text>
<text x="430" y="174" class="tm">logs --previous</text>
<text x="430" y="196">- exec format error:</text><text x="430" y="216">  arm64 image, amd64 node</text>
<text x="430" y="236">- env not set: Secret in</text><text x="430" y="256">  another namespace, or the</text>
<text x="430" y="276">  key name is wrong</text>
<text x="610" y="174" class="tm">debug pod, test the path</text>
<text x="610" y="196">- connection refused:</text><text x="610" y="216">  RDS SG lacks node SG</text>
<text x="610" y="236">- no 0.0.0.0/0 route</text><text x="610" y="256">  to a NAT gateway</text>
<text x="610" y="276">- VPC peering routes</text>
</g>
<rect x="24" y="300" width="736" height="104" rx="12" class="s1f"/>
<text x="40" y="324" class="f1 disp" font-size="13.5">Same order, every time</text>
<g font-size="12.5" class="t">
<text x="40" y="350">1 status  >  2 describe (Events)  >  3 logs  >  4 network  >  5 dependencies  >  6 resources</text>
<text x="40" y="376" class="t2">Events say what Kubernetes is doing. Logs say what your app is doing. Read both.</text>
<text x="40" y="396" class="egg" font-size="11.5">and then ask what changed in the last 24 hours</text>
</g>
</svg>
