<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" width="780" height="418" role="img" aria-label="Kubernetes ecosystem tools grouped by the problem they solve"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Heiti TC","Noto Sans TC",Arial,sans-serif}
.disp{font-weight:700}
.mono{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace}
.t{fill:#1A2040}.t2{fill:#434C70}.tm{fill:#69719A}
.f1{fill:#3E63DD}.f2{fill:#B07606}.f3{fill:#12927F}.fw{fill:#B4442E}
.s1f{fill:#E3E9FC}.s2f{fill:#F6ECD6}.s3f{fill:#D9F1EC}.swf{fill:#F8E2DC}
.pp{fill:#FFFFFF}.pp2{fill:#EEF1F8}
.ln{stroke:#D3D9EA;fill:none}.lk{stroke:#434C70;fill:none}
.l1{stroke:#3E63DD;fill:none}.l2{stroke:#B07606;fill:none}.l3{stroke:#12927F;fill:none}.lw{stroke:#B4442E;fill:none}
.egg{fill:#7A5BB0;font-style:italic}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#434C70"/></marker>
<marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E63DD"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B07606"/></marker>
<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12927F"/></marker>
</defs><rect x="1" y="1" width="778" height="416" rx="16" fill="#F7F8FC" stroke="#D3D9EA"/><rect x="20" y="20" width="740" height="52" rx="10" class="pp2"/><text x="34" y="52" class="tm disp" font-size="13">Operate</text><rect x="20" y="80" width="740" height="52" rx="10" class="pp2"/><text x="34" y="112" class="tm disp" font-size="13">Deliver</text><rect x="20" y="140" width="740" height="52" rx="10" class="pp2"/><text x="34" y="172" class="tm disp" font-size="13">Scale</text><rect x="20" y="200" width="740" height="52" rx="10" class="pp2"/><text x="34" y="232" class="tm disp" font-size="13">Network</text><rect x="20" y="260" width="740" height="52" rx="10" class="pp2"/><text x="34" y="292" class="tm disp" font-size="13">Secure</text><rect x="20" y="320" width="740" height="52" rx="10" class="pp2"/><text x="34" y="352" class="tm disp" font-size="13">Observe</text><rect x="100" y="28" width="150" height="36" rx="18" class="f1"/><text x="175.0" y="51" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">K9s / Lens</text><text x="264" y="51" class="t2" font-size="12">kubectl 50 times a day, 5 namespaces, one typo away from prod</text><rect x="100" y="88" width="150" height="36" rx="18" class="f1"/><text x="175.0" y="111" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Argo CD</text><text x="264" y="111" class="t2" font-size="12">apply from a laptop, cluster drifts from Git; Git becomes the truth</text><rect x="100" y="148" width="110" height="36" rx="18" class="f1"/><text x="155.0" y="171" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">KEDA</text><rect x="218" y="148" width="110" height="36" rx="18" class="f1"/><text x="273.0" y="171" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Karpenter</text><text x="340" y="162" class="t2" font-size="12">200,000 queued messages at 5% CPU: scale on the queue</text><text x="340" y="178" class="t2" font-size="12">pods added, nodes full: grow a node</text><rect x="100" y="208" width="150" height="36" rx="18" class="f1"/><text x="175.0" y="231" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">NetworkPolicy</text><rect x="258" y="208" width="150" height="36" rx="18" class="f1"/><text x="333.0" y="231" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Istio / Linkerd</text><text x="420" y="222" class="t2" font-size="12">every pod can reach every pod by default;</text><text x="420" y="238" class="t2" font-size="12">service-to-service traffic is invisible</text><rect x="100" y="268" width="170" height="36" rx="18" class="f1"/><text x="185.0" y="291" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Secrets Store CSI</text><rect x="278" y="268" width="110" height="36" rx="18" class="f1"/><text x="333.0" y="291" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Kyverno</text><text x="400" y="282" class="t2" font-size="12">Secrets are base64: mount them from a vault</text><text x="400" y="298" class="t2" font-size="12">root containers, no limits: stop them at the door</text><rect x="100" y="328" width="200" height="36" rx="18" class="f1"/><text x="200.0" y="351" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Prometheus + Grafana</text><rect x="308" y="328" width="100" height="36" rx="18" class="f1"/><text x="358.0" y="351" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Jaeger</text><text x="420" y="342" class="t2" font-size="12">no numbers, no answers: see the spike;</text><text x="420" y="358" class="t2" font-size="12">but which request? follow it hop by hop</text><text x="20" y="400" class="egg" font-size="11.5">every chip on this shelf was born in somebody's incident review</text></svg>
